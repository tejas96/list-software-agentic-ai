# Local and single-host deployment of the platform.
# Postgres 17 (with pgvector) holds platform data AND Temporal's persistence.
#
#   Infrastructure only (development):  docker compose -f infra/docker-compose.yml up -d
#   Whole platform:                     docker compose -f infra/docker-compose.yml --profile app up -d --build
#
# The app services read secrets from the repository-root .env (see .env.example).
name: lsa

x-app-env: &app-env
  env_file: ../.env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-lsa}:${POSTGRES_PASSWORD:-lsa}@postgres:5432/${POSTGRES_DB:-lsa}
    TEMPORAL_ADDRESS: temporal:7233
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    NODE_ENV: production

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lsa}
      POSTGRES_DB: ${POSTGRES_DB:-lsa}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lsa} -d ${POSTGRES_DB:-lsa}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates or upgrades Temporal's two databases, then exits. Safe to run on every `up`.
  temporal-schema:
    image: temporalio/admin-tools:1.30.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: '5432'
      SQL_USER: ${POSTGRES_USER:-lsa}
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-lsa}
    entrypoint: ['sh', '-c']
    command:
      - |
        set -e
        S=/etc/temporal/schema/postgresql/v12
        for db in temporal temporal_visibility; do
          dir=$$S/temporal; [ $$db = temporal_visibility ] && dir=$$S/visibility
          temporal-sql-tool --db $$db create-database 2>/dev/null || true
          temporal-sql-tool --db $$db setup-schema -v 0.0 2>/dev/null || true
          temporal-sql-tool --db $$db update-schema -d $$dir/versioned
        done
    restart: 'no'

  temporal:
    image: temporalio/server:1.30.6
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    # Read by the server's built-in config template.
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-lsa}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-lsa}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
    volumes:
      - './temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro'
    ports:
      - '${TEMPORAL_PORT:-7233}:7233'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 7233 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30

  # Registers the namespace the apps use, then exits.
  temporal-namespace:
    image: temporalio/admin-tools:1.30.6
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      NS: ${TEMPORAL_NAMESPACE:-default}
    entrypoint: ['sh', '-c']
    command:
      - |
        for i in $$(seq 1 30); do
          temporal operator namespace describe -n $$NS >/dev/null 2>&1 && exit 0
          temporal operator namespace create -n $$NS >/dev/null 2>&1 && exit 0
          sleep 2
        done
        echo "could not register namespace $$NS"; exit 1
    restart: 'no'

  temporal-ui:
    image: temporalio/ui:2.39.0
    profiles: ['ui']
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - '8233:8080'

  # ------------------------------------------------------------ application
  migrate:
    profiles: ['app']
    build: { context: .., target: api, args: { NODE_IMAGE: '${NODE_IMAGE:-node:22-bookworm-slim}' } }
    image: lsa-api
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    # Applies migrations, then creates the first administrator if there are no users.
    command:
      ['sh', '-c', 'node node_modules/@lsa/db/dist/migrate.js && node node_modules/@lsa/db/dist/seed.js']
    restart: 'no'

  api:
    profiles: ['app']
    image: lsa-api
    <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: ['app']
    build: { context: .., target: worker, args: { NODE_IMAGE: '${NODE_IMAGE:-node:22-bookworm-slim}' } }
    image: lsa-worker
    <<: *app-env
    hostname: lsa-worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    volumes:
      - workspaces:/data/workspaces
    restart: unless-stopped

  web:
    profiles: ['app']
    build:
      context: ..
      target: web
      args: { NODE_IMAGE: '${NODE_IMAGE:-node:22-bookworm-slim}', API_INTERNAL_URL: 'http://api:4000' }
    image: lsa-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'
    restart: unless-stopped

volumes:
  pgdata:
  workspaces:
